<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Evaluator</title>

    <!-- Bootstrap 5: default styling solution for layout, spacing, flex, type, borders, shadows -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons: reset / trash icons for the Action column -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS loads AFTER Bootstrap so calculator-specific 3D/LCD effects win where needed -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-8">

                <!-- ===== Grade Evaluator Dashboard ===== -->
                <section class="card border-0 shadow rounded-4 overflow-hidden ge-card" aria-labelledby="ge_page_title">
                    <div class="card-header bg-dark text-white border-0 px-3 px-md-4 py-3 d-flex flex-wrap align-items-center justify-content-between gap-2">
                        <div class="d-flex align-items-center gap-3">
                            <span class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-25 text-white rounded-3 p-2">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                                    <path d="M4 0h8a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2zm0 1a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H4z"/>
                                    <path d="M5.5 4h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1 0-1zm0 2.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1 0-1zm0 2.5h3a.5.5 0 0 1 0 1h-3a.5.5 0 0 1 0-1z"/>
                                </svg>
                            </span>
                            <div>
                                <h1 class="h6 fw-bold text-uppercase mb-0" id="ge_page_title">Grade Evaluator</h1>
                                <small class="text-white-50">Cesar Francisco</small>
                            </div>
                        </div>
                        <span class="badge rounded-pill text-bg-light fw-medium">S.Y. 2026&ndash;2027</span>
                    </div>

                    <div class="card-body p-3 p-md-4 bg-body-tertiary">
                        <div class="table-responsive border rounded-3 bg-white shadow-sm">
                            <table class="table align-middle text-center mb-0 ge-table">
                                <caption class="visually-hidden">Enter quarterly grades for each subject to calculate averages and remarks.</caption>
                                <thead class="table-dark align-middle">
                                    <tr>
                                        <th rowspan="2" class="ge-col-area text-start ps-3 fw-semibold text-uppercase small">Subjects</th>
                                        <th colspan="4" class="align-middle fw-semibold text-uppercase small">Quarter</th>
                                        <th rowspan="2" class="ge-col-final align-middle fw-semibold text-uppercase small">Average</th>
                                        <th rowspan="2" class="ge-col-remarks align-middle fw-semibold text-uppercase small">Remarks</th>
                                        <th rowspan="2" class="ge-col-action align-middle fw-semibold text-uppercase small">Actions</th>
                                    </tr>
                                    <tr>
                                        <th class="ge-col-q fw-semibold">1</th>
                                        <th class="ge-col-q fw-semibold">2</th>
                                        <th class="ge-col-q fw-semibold">3</th>
                                        <th class="ge-col-q fw-semibold">4</th>
                                    </tr>
                                </thead>
                            <tbody class="ge-subjects" id="ge_subjects_body">
                                <tr>
                                    <td class="text-start">
                                        <input type="text" class="form-control form-control-sm px-2 ge-name-input" value="Filipino" placeholder="e.g. Mathematics" maxlength="60" aria-label="Subject name" title="Enter the subject name">
                                    </td>
                                    <td><input type="text" inputmode="decimal" autocomplete="off" class="form-control form-control-sm text-center px-1 ge-input" min="0" max="100" step="0.01" placeholder="0-100" title="Enter grade" aria-label="Quarter 1 grade for Filipino"></td>
                                    <td><input type="text" inputmode="decimal" autocomplete="off" class="form-control form-control-sm text-center px-1 ge-input" min="0" max="100" step="0.01" placeholder="0-100" title="Enter grade" aria-label="Quarter 2 grade for Filipino"></td>
                                    <td><input type="text" inputmode="decimal" autocomplete="off" class="form-control form-control-sm text-center px-1 ge-input" min="0" max="100" step="0.01" placeholder="0-100" title="Enter grade" aria-label="Quarter 3 grade for Filipino"></td>
                                    <td><input type="text" inputmode="decimal" autocomplete="off" class="form-control form-control-sm text-center px-1 ge-input" min="0" max="100" step="0.01" placeholder="0-100" title="Enter grade" aria-label="Quarter 4 grade for Filipino"></td>
                                    <td class="fw-semibold text-primary-emphasis"></td>
                                    <td class="text-center"><span class="badge rounded-pill text-warning-emphasis bg-warning-subtle fw-medium">Incomplete</span></td>
                                    <td class="ge-col-action">
                                        <div class="d-inline-flex align-items-center gap-1">
                                            <span class="d-inline-block ge-tooltip-host" tabindex="0" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Clear all subject grades"><button type="button" class="btn btn-sm btn-outline-secondary ge-action-btn ge-action-reset" aria-label="Clear all subject grades" disabled><i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i></button></span>
                                            <button type="button" class="btn btn-sm btn-outline-danger ge-action-btn ge-action-delete" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Remove subject" aria-label="Delete subject"><i class="bi bi-trash3" aria-hidden="true"></i></button>
                                        </div>
                                    </td>
                                </tr>
                                <tr>
                                    <td class="text-start">
                                        <input type="text" class="form-control form-control-sm px-2 ge-name-input" value="English" placeholder="e.g. Mathematics" maxlength="60" aria-label="Subject name" title="Enter the subject name">
                                    </td>
                                    <td><input type="text" inputmode="decimal" autocomplete="off" class="form-control form-control-sm text-center px-1 ge-input" min="0" max="100" step="0.01" placeholder="0-100" title="Enter grade" aria-label="Quarter 1 grade for English"></td>
                                    <td><input type="text" inputmode="decimal" autocomplete="off" class="form-control form-control-sm text-center px-1 ge-input" min="0" max="100" step="0.01" placeholder="0-100" title="Enter grade" aria-label="Quarter 2 grade for English"></td>
                                    <td><input type="text" inputmode="decimal" autocomplete="off" class="form-control form-control-sm text-center px-1 ge-input" min="0" max="100" step="0.01" placeholder="0-100" title="Enter grade" aria-label="Quarter 3 grade for English"></td>
                                    <td><input type="text" inputmode="decimal" autocomplete="off" class="form-control form-control-sm text-center px-1 ge-input" min="0" max="100" step="0.01" placeholder="0-100" title="Enter grade" aria-label="Quarter 4 grade for English"></td>
                                    <td class="fw-semibold text-primary-emphasis"></td>
                                    <td class="text-center"><span class="badge rounded-pill text-warning-emphasis bg-warning-subtle fw-medium">Incomplete</span></td>
                                    <td class="ge-col-action">
                                        <div class="d-inline-flex align-items-center gap-1">
                                            <span class="d-inline-block ge-tooltip-host" tabindex="0" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Clear all subject grades"><button type="button" class="btn btn-sm btn-outline-secondary ge-action-btn ge-action-reset" aria-label="Clear all subject grades" disabled><i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i></button></span>
                                            <button type="button" class="btn btn-sm btn-outline-danger ge-action-btn ge-action-delete" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Remove subject" aria-label="Delete subject"><i class="bi bi-trash3" aria-hidden="true"></i></button>
                                        </div>
                                    </td>
                                </tr>
                                <tr>
                                    <td class="text-start">
                                        <input type="text" class="form-control form-control-sm px-2 ge-name-input" value="Mathematics" placeholder="e.g. Mathematics" maxlength="60" aria-label="Subject name" title="Enter the subject name">
                                    </td>
                                    <td><input type="text" inputmode="decimal" autocomplete="off" class="form-control form-control-sm text-center px-1 ge-input" min="0" max="100" step="0.01" placeholder="0-100" title="Enter grade" aria-label="Quarter 1 grade for Mathematics"></td>
                                    <td><input type="text" inputmode="decimal" autocomplete="off" class="form-control form-control-sm text-center px-1 ge-input" min="0" max="100" step="0.01" placeholder="0-100" title="Enter grade" aria-label="Quarter 2 grade for Mathematics"></td>
                                    <td><input type="text" inputmode="decimal" autocomplete="off" class="form-control form-control-sm text-center px-1 ge-input" min="0" max="100" step="0.01" placeholder="0-100" title="Enter grade" aria-label="Quarter 3 grade for Mathematics"></td>
                                    <td><input type="text" inputmode="decimal" autocomplete="off" class="form-control form-control-sm text-center px-1 ge-input" min="0" max="100" step="0.01" placeholder="0-100" title="Enter grade" aria-label="Quarter 4 grade for Mathematics"></td>
                                    <td class="fw-semibold text-primary-emphasis"></td>
                                    <td class="text-center"><span class="badge rounded-pill text-warning-emphasis bg-warning-subtle fw-medium">Incomplete</span></td>
                                    <td class="ge-col-action">
                                        <div class="d-inline-flex align-items-center gap-1">
                                            <span class="d-inline-block ge-tooltip-host" tabindex="0" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Clear all subject grades"><button type="button" class="btn btn-sm btn-outline-secondary ge-action-btn ge-action-reset" aria-label="Clear all subject grades" disabled><i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i></button></span>
                                            <button type="button" class="btn btn-sm btn-outline-danger ge-action-btn ge-action-delete" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Remove subject" aria-label="Delete subject"><i class="bi bi-trash3" aria-hidden="true"></i></button>
                                        </div>
                                    </td>
                                </tr>
                                <tr>
                                    <td class="text-start">
                                        <input type="text" class="form-control form-control-sm px-2 ge-name-input" value="Science" placeholder="e.g. Mathematics" maxlength="60" aria-label="Subject name" title="Enter the subject name">
                                    </td>
                                    <td><input type="text" inputmode="decimal" autocomplete="off" class="form-control form-control-sm text-center px-1 ge-input" min="0" max="100" step="0.01" placeholder="0-100" title="Enter grade" aria-label="Quarter 1 grade for Science"></td>
                                    <td><input type="text" inputmode="decimal" autocomplete="off" class="form-control form-control-sm text-center px-1 ge-input" min="0" max="100" step="0.01" placeholder="0-100" title="Enter grade" aria-label="Quarter 2 grade for Science"></td>
                                    <td><input type="text" inputmode="decimal" autocomplete="off" class="form-control form-control-sm text-center px-1 ge-input" min="0" max="100" step="0.01" placeholder="0-100" title="Enter grade" aria-label="Quarter 3 grade for Science"></td>
                                    <td><input type="text" inputmode="decimal" autocomplete="off" class="form-control form-control-sm text-center px-1 ge-input" min="0" max="100" step="0.01" placeholder="0-100" title="Enter grade" aria-label="Quarter 4 grade for Science"></td>
                                    <td class="fw-semibold text-primary-emphasis"></td>
                                    <td class="text-center"><span class="badge rounded-pill text-warning-emphasis bg-warning-subtle fw-medium">Incomplete</span></td>
                                    <td class="ge-col-action">
                                        <div class="d-inline-flex align-items-center gap-1">
                                            <span class="d-inline-block ge-tooltip-host" tabindex="0" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Clear all subject grades"><button type="button" class="btn btn-sm btn-outline-secondary ge-action-btn ge-action-reset" aria-label="Clear all subject grades" disabled><i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i></button></span>
                                            <button type="button" class="btn btn-sm btn-outline-danger ge-action-btn ge-action-delete" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Remove subject" aria-label="Delete subject"><i class="bi bi-trash3" aria-hidden="true"></i></button>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                            <!-- "Add subject" control: lives in its own tbody so it
                                 always sits directly underneath the last subject row -->
                            <tbody class="ge-add-tbody">
                                <tr>
                                    <td colspan="8" class="p-2">
                                        <button type="button" class="btn w-100 d-inline-flex align-items-center justify-content-center gap-2 ge-add-btn" id="ge_add_subject_button" aria-label="Add a new subject row" title="Add subject">
                                            <i class="bi bi-plus-lg" aria-hidden="true"></i>
                                            <span>Add subject</span>
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                            <tfoot>
                                <tr>
                                    <td class="text-start ps-3 fw-semibold">Total Average</td>
                                    <td></td>
                                    <td></td>
                                    <td></td>
                                    <td></td>
                                    <td id="ge_total_average" class="text-center fw-bold fs-6"></td>
                                    <td id="total_average_remarks" class="text-center fw-bold fs-6"></td>
                                    <td class="ge-col-action"></td>
                                </tr>
                            </tfoot>
                        </table>
                        </div>
                    </div>
                </section>

            </div>
        </div>
    </main>

    <!-- ===== Confirmation modal for destructive actions (Clear grades / Remove subject) ===== -->
    <div class="modal fade" id="ge_confirm_modal" tabindex="-1" aria-labelledby="ge_confirm_modal_title" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4">
                <div class="modal-header">
                    <h5 class="modal-title" id="ge_confirm_modal_title">Confirm action</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="ge_confirm_modal_body"></div>
                <div class="modal-footer flex-column flex-sm-row gap-2">
                    <button type="button" class="btn ge-confirm-cancel px-4" data-bs-dismiss="modal">
                        <i class="bi bi-x-lg me-1" aria-hidden="true"></i>Cancel
                    </button>
                    <button type="button" class="btn ge-confirm-action px-4" id="ge_confirm_modal_action">
                        <i class="bi bi-check-lg me-1" aria-hidden="true"></i>Confirm
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Screen-reader live region announcing add-subject feedback -->
    <div id="ge_live_region" class="ge-visually-hidden" aria-live="polite" role="status"></div>

    <!-- Toast container for success notifications (subject removal / grade reset) -->
    <div id="ge_toast_container" class="ge-toast-container" aria-live="polite" aria-atomic="true"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
